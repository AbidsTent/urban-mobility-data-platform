name: Project phase task
description: Plan and verify a specific implementation or documentation requirement.
title: "[P0] "
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement / phase ID
      placeholder: "P0-01, FR-02, T-01"
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Goal and context
      description: What problem will this task solve?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Implementation checklist
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / reproducible proof
      value: |
        - [ ] Test or documented review executed
        - [ ] Evidence linked
        - [ ] Documentation updated
    validations:
      required: true
